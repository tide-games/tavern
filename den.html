<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Den — heads-up for gold</title>
<meta name="description" content="A back room of the Tavern: heads-up limit hold'em against the Libre Poker champion, gold on each side, play to the felt. A standalone test — no seals yet.">
<!-- SKIN: forked from Libre Poker's cash table (the same bargain as ever:
     duplication for zero blast radius). Engines and the champion's brain are
     imported live from librepoker.org — the den brings only the gold. -->
<style>
:root{
  --room:#241c15; --room2:#33291f;
  --felt:#2c6e57; --felt2:#1f5240; --felt3:#17402f;
  --rail:#6e4522; --railhi:#a4713f; --raillo:#4a2d14;
  --brass:#c9a45c; --ink:#f2ede4; --ink-soft:#b8ac9a; --ink-mut:#8d8272;
  --card:#fdfbf5; --red:#c33; --black:#20242c;
  --gold:#e9c15c; --navy:#3d6ea5; --green:#3f7d4e; --danger:#d66;
  --line:#ffffff22;
  --cw:clamp(46px,5vw,62px); --ch:calc(var(--cw)*1.42);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 30%, var(--room2) 0%, var(--room) 55%, #150f09 100%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;
}
button{cursor:pointer}

/* ---- top bar */
#top{
  display:flex;align-items:center;gap:6px;padding:8px 16px;
  border-bottom:1px solid #00000055;flex:none;flex-wrap:wrap;
}
#top .word{font-weight:800;letter-spacing:.06em;font-size:17px;text-decoration:none;color:var(--ink)}
#top .word b{color:var(--gold)}
#top .meta{font-size:12.5px;color:var(--ink-mut);font-weight:600;margin-left:10px}
#top .spacer{flex:1}
#top .div{width:1px;height:20px;background:#ffffff1e;margin:0 8px}
.chip{
  background:#00000033;border:1px solid #ffffff22;color:var(--ink);
  border-radius:8px;height:30px;display:inline-flex;align-items:center;gap:6px;
  padding:0 11px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
}
.chip:hover{background:#00000055}
.chip.on{border-color:var(--gold);color:var(--gold)}
.chip.leak-ok{color:#8fd0a0} .chip.leak-bad{color:var(--danger)}

/* ---- the table */
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
#tablewrap{position:relative;width:min(74vw,940px);height:min(62vh,450px);min-height:380px}
#table{
  position:absolute;inset:0;
  border-radius:50% / 48%;
  background:
    radial-gradient(ellipse 62% 55% at 50% 42%, #35836a 0%, var(--felt) 45%, var(--felt2) 78%, var(--felt3) 100%);
  border:16px solid transparent;
  background-clip:padding-box;
  box-shadow:
    inset 0 12px 34px rgba(0,0,0,.45),
    inset 0 -16px 44px rgba(0,0,0,.38);
}
#tablewrap::before{
  content:'';position:absolute;inset:-4px;border-radius:50% / 48%;
  background:linear-gradient(180deg, #9b6b3a 0%, #7a5230 38%, #5c3a1e 72%, #3a2412 100%);
  box-shadow:
    inset 0 3px 4px rgba(255,255,255,.35),
    inset 0 -6px 12px rgba(0,0,0,.65),
    0 26px 60px rgba(0,0,0,.65),
    0 6px 16px rgba(0,0,0,.5);
}
#table::after{
  content:'LIBRE POKER';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:clamp(26px,3vw,42px);letter-spacing:.5em;color:#ffffff0d;font-weight:800;
  pointer-events:none;white-space:nowrap;transition:color .4s;
}
#table.boardout::after{color:#ffffff05}

/* ---- seats */
.seat{
  position:absolute;left:50%;transform:translateX(-50%);
  width:clamp(200px,25vw,258px);
  background:linear-gradient(180deg, rgba(10,26,20,.92), rgba(6,16,12,.96));
  border:1px solid rgba(212,175,105,.30);border-radius:26px;
  padding:7px 14px 9px;color:var(--ink);
  box-shadow:0 8px 18px rgba(0,0,0,.45);
  transition:border-color .2s, box-shadow .2s, opacity .3s;
}
#seat-1{top:-24px} #seat-0{bottom:-24px}
.seat.folded{opacity:.55;filter:saturate(.6)}
.fcards{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;justify-content:center;
}
#cards-1{top:34px;z-index:4}
#cards-0{bottom:26px;z-index:4}
.seat{z-index:5}
#cards-0 .card{width:calc(var(--cw)*1.16);height:calc(var(--ch)*1.16)}
#cards-0 .card .cr{font-size:calc(var(--cw)*1.16*.34)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:40}
#fx .flych{position:absolute;transition:transform .42s cubic-bezier(.45,0,.35,1), opacity .42s}
.seat.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(233,193,92,.45), 0 8px 18px rgba(0,0,0,.45)}
.seat.winner{
    border-color:#ffd97a;
    background:linear-gradient(180deg, rgba(46,38,14,.94), rgba(24,19,8,.96));
    box-shadow:0 0 0 2px #ffd97a, 0 0 34px rgba(255,217,122,.6), 0 8px 18px rgba(0,0,0,.45);
  }
.seat .who{display:flex;align-items:center;gap:9px}
.seat .idc{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.seat .stkc{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:0}
.seat .av{
  width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%, #3c5a4a, #1c2e24);
  border:1px solid rgba(212,175,105,.4);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.seat .nm{font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.seat .pos{
  font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#0e1a12;
  background:var(--brass);border-radius:6px;padding:1px 5px;
}
.seat .stk{font-size:16px;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.seat .bbline{font-size:10.5px;color:var(--ink-mut)}
.seat .said{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-19px;z-index:6;
}
#seat-1 .said{bottom:auto;top:-13px}
#seat-0 .said, #seat-1 .said{
  font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  background:#000000cc;border:1px solid #ffffff2a;border-radius:10px;
  padding:2px 11px;white-space:nowrap;min-height:0;
}
.seat .said:empty{display:none}
.seat .tbar{
  position:absolute;left:10%;right:10%;bottom:3px;height:3px;border-radius:2px;
  background:#00000040;overflow:hidden;display:none;
}
.seat.active .tbar{display:block}
.seat .tbar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:2px;transition:width .3s linear}
.seat .tbar i.drain{transition:width 30s linear;width:0}
.seat .dbtn{
  position:absolute;right:-13px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(180deg,#fff,#d8d2c2);color:#222;
  border:2px solid var(--brass);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.55);
}

/* ---- bets as chip stacks */
.bet{
  position:absolute;left:50%;transform:translateX(-50%);
  display:none;align-items:flex-end;gap:7px;
  font-size:13px;font-weight:800;color:var(--ink);
  background:#00000052;padding:5px 13px 5px 9px;border-radius:16px;font-size:14px;
  font-variant-numeric:tabular-nums;border:1px solid #ffffff12;
}
.bet.show{display:inline-flex}
.cstack{display:flex;align-items:flex-end;gap:3px}
.cstack .col{position:relative;width:20px;height:26px}
.cstack .col i{
  position:absolute;left:0;width:20px;height:20px;border-radius:50%;
  border:2px dashed #ffffffc8;box-shadow:0 1.5px 3px #000c;
}
.cstack .col i:nth-child(1){bottom:0}
.cstack .col i:nth-child(2){bottom:5px}
.cstack .col i:nth-child(3){bottom:10px}
.cstack .col i:nth-child(4){bottom:15px}
.cstack .d5 i{background:radial-gradient(circle at 35% 32%, #d96a6a, #8f2b2b)}
.cstack .d25 i{background:radial-gradient(circle at 35% 32%, #63b07a, #2c6a42)}
.cstack .d100 i{background:radial-gradient(circle at 35% 32%, #565656, #101010)}
.cstack .d500 i{background:radial-gradient(circle at 35% 32%, #9a6bc9, #55307f)}
#bet-1{top:100px;left:calc(50% + 128px)}
#bet-0{bottom:112px;left:calc(50% - 138px)}

/* ---- cards */
.card{
  width:var(--cw);height:var(--ch);border-radius:8px;background:var(--card);
  color:var(--black);position:relative;
  box-shadow:0 3px 8px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  font-weight:800;
}
.card.red{color:var(--red)}
body.fourc .card.s-d{color:#2e6fd0}
body.fourc .card.s-c{color:#2c8a52}
.card .cr{
  position:absolute;top:6%;left:9%;line-height:.95;text-align:center;
  font-size:calc(var(--cw)*.34);letter-spacing:-.05em;
}
.card .cr b{display:block;font-size:.8em;font-weight:800}
.card .cp{
  position:absolute;inset:12% 0 0 0;display:grid;place-items:center;
  font-size:calc(var(--cw)*.52);line-height:1;
}
.card.back{
  background:
    repeating-linear-gradient(45deg,#ffffff22 0 3px,transparent 3px 8px),
    radial-gradient(circle at 50% 45%, #24596a, #12303a);
  border:3px solid #f4efe2;
  box-shadow:inset 0 0 0 2px rgba(201,162,75,.55), 0 3px 8px rgba(0,0,0,.35);
}
.card.dead{opacity:.7;filter:saturate(.85)}
.card.win{box-shadow:0 0 0 2px var(--gold), 0 0 16px rgba(233,193,92,.5)}
@keyframes cardin{from{transform:translateY(-14px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.card.flipin{animation:cardin .28s ease}

/* ---- center */
#mid{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;
}
#potrow{display:flex;align-items:flex-end;gap:10px;min-height:36px}
#potchips{display:flex;align-items:flex-end}
#pot{
  display:inline-flex;align-items:center;gap:8px;
  font-size:14px;color:var(--gold);font-weight:800;min-height:24px;
  background:#00000048;border-radius:20px;padding:4px 16px;
  font-variant-numeric:tabular-nums;border:1px solid #ffffff10;
}
#pot.winline{transform:scale(1.2);border-color:rgba(255,217,122,.65);box-shadow:0 0 22px rgba(233,193,92,.3);background:#00000070}
#pot{transition:transform .15s}
#pot:empty{visibility:hidden}
#board{display:flex;gap:clamp(6px,.7vw,9px);min-height:calc(var(--ch) + 2px)}
#verdict{min-height:28px;display:flex;gap:10px;justify-content:center;align-items:center}
#verdict .vtag{
  font-size:13px;font-weight:800;background:#000000aa;border-radius:12px;
  padding:3px 14px;text-shadow:0 1px 3px #000;
}
#verdict .vtag.vw{color:var(--gold);border:1px solid rgba(233,193,92,.5)}
#verdict .vtag.vl{color:var(--ink-mut)}

/* ---- action bar */
#bottom{
  flex:none;padding:6px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.4) 40%, rgba(0,0,0,.6));
}
#caption{
  text-align:center;font-size:14px;font-weight:700;color:var(--gold);
  min-height:44px;padding:2px 12px;text-shadow:0 1px 3px #000;
  display:flex;align-items:center;justify-content:center;
}
#caption a{color:#5fc7d6}
#actions{display:flex;gap:10px;justify-content:center;align-items:center;min-height:58px;
  border-top:3px solid transparent;border-radius:6px;transition:background .12s,border-color .12s}
#actions.pos-btn{background:rgba(212,175,55,.13);border-top-color:var(--gold)}
#actions.pos-bb{background:rgba(90,140,220,.13);border-top-color:#5a8cdc}
#actions button{
  border:none;border-radius:10px;height:52px;min-width:150px;padding:0 22px;
  font-size:15px;font-weight:800;color:#fff;letter-spacing:.03em;position:relative;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 3px 8px rgba(0,0,0,.35);
}
#actions button:disabled{opacity:.4;cursor:default}
#b-fold{background:linear-gradient(180deg,#9c574a,#7c4237)}
#b-call{background:linear-gradient(180deg,#3f8158,#2b6142)}
#b-raise{background:linear-gradient(180deg,#d9b45a,#a8842e)}
#b-next{background:linear-gradient(180deg,#3f8158,#2b6142);min-width:200px}
#actions .sub{font-size:11px;font-weight:600;opacity:.55;font-variant-numeric:tabular-nums}
#actions .sub.hot{opacity:1;font-weight:800}
#actions .qbtn{
  background:#00000048;border:1px solid #ffffff26;color:var(--ink);
  min-width:0;width:40px;height:40px;border-radius:50%;padding:0;font-size:16px;
  margin-right:16px;box-shadow:none;
}
#actions .qbtn.on{background:var(--gold);color:#241d18;border-color:var(--gold)}

/* ---- activity log drawer */
#logdrawer{
  position:fixed;top:47px;right:0;bottom:0;width:min(320px,80vw);z-index:15;
  background:linear-gradient(180deg,#241d16f2,#1a140df6);
  border-left:1px solid #ffffff1e;transform:translateX(100%);
  transition:transform .25s ease;display:flex;flex-direction:column;
}
#logdrawer.open{transform:none}
#logdrawer .lh{
  font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--ink-mut);
  padding:12px 16px 8px;border-bottom:1px solid #ffffff14;
}
#logbody{
  flex:1;overflow-y:auto;padding:10px 16px;font-size:12.5px;line-height:1.75;
  scrollbar-width:thin;font-variant-numeric:tabular-nums;
}
#logbody .lw{color:#8fd0a0;font-weight:700}
#logbody .lh2{color:var(--gold);font-weight:800;margin-top:6px}
#logbody .lm{color:var(--ink-mut)}

/* ---- modals */
.wrap{
  position:fixed;inset:0;background:#000000aa;display:none;
  align-items:center;justify-content:center;padding:18px;z-index:20;
}
.wrap.open{display:flex}
.modal{
  user-select:text;
  background:linear-gradient(180deg,#3a302a,#2f2823);border:1px solid #ffffff22;
  border-radius:14px;max-width:680px;width:100%;max-height:88vh;overflow:auto;
  padding:24px 28px;position:relative;box-shadow:0 20px 80px #000c;color:var(--ink);
}
.modal h2{font-size:20px;letter-spacing:.04em;margin-bottom:14px;color:var(--gold)}
.modal .x{
  position:absolute;top:12px;right:14px;background:none;border:none;
  font-size:18px;color:var(--ink-soft);
}
.mbtn{font-size:13px;font-weight:700;border:none;border-radius:6px;padding:5px 14px;color:#fff}
.score-row{cursor:pointer;border-radius:6px;padding:1px 6px}
.score-row:hover{background:#ffffff10}
a{color:#5fc7d6}
@media (max-width:700px){
  #tablewrap{width:94vw;min-height:340px}
  #actions button{min-width:110px;height:46px;font-size:13px}
  .seat{width:min(64vw,230px)}
}
</style>
<style>
#denbadge{background:#4a3a1e;color:#e9c15c;border:1px solid rgba(233,193,92,.4);border-radius:10px;
  padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.08em}
#score{font-variant-numeric:tabular-nums}
#matchover{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;
  background:rgba(10,8,5,.82)}
#matchover.show{display:flex}
#matchover .card2{background:linear-gradient(180deg,#33291f,#241c15);border:1px solid rgba(233,193,92,.5);
  border-radius:18px;padding:34px 44px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.7)}
#matchover h2{font-size:26px;color:var(--gold);margin-bottom:8px}
#matchover p{color:var(--ink-soft);font-size:14px;margin-bottom:18px}
#matchover button{background:linear-gradient(180deg,#f0c968,#b08a3e);color:#241d12;border:0;border-radius:9px;
  padding:10px 26px;font-weight:800;font-size:13px;letter-spacing:.08em;cursor:pointer}
#matchover .sub2{margin-top:14px}
#matchover .sub2 a{color:#5fc7d6;font-size:12px;cursor:pointer}
#matchover.peek{background:transparent;pointer-events:none}
#matchover.peek .card2{display:none}
#peekback{position:fixed;right:16px;bottom:16px;z-index:90;display:none;
  background:linear-gradient(180deg,#f0c968,#b08a3e);color:#241d12;border:0;border-radius:9px;
  padding:9px 18px;font-weight:800;font-size:12px;letter-spacing:.06em;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
#matchover.peek ~ #peekback, #peekback.show{display:block}
</style>
</head>
<body>

<div id="top">
  <a class="word" href="./"><b>The</b> Tavern · <span style="color:#e9c15c">the den</span></a>
  <span class="meta" id="tmeta">limit hold'em · heads-up · play to the felt</span>
  <span id="denbadge">⚜ GOLD · standalone test</span>
  <span class="spacer"></span>
  <span class="meta" id="score">…</span>
  <button class="chip" id="b-fourc" title="Four-color deck">🎨</button>
  <button class="chip" id="b-sound" title="Sound"></button>
</div>

<div id="stage">
  <div id="tablewrap">
  <div id="table"></div>
    <div class="seat" id="seat-1">
      <div class="who"><span class="av">🤖</span><span class="idc"><span class="nm"></span><span class="pos"></span></span><span class="stkc"><span class="stk"></span><span class="bbline"></span></span></div>
      <div class="said"></div>
      <div class="tbar"><i></i></div>
    </div>
    <div class="fcards" id="cards-1"></div>
    <div class="bet" id="bet-1"><span class="cstack"></span><span class="amt"></span></div>
    <div class="bet" id="bet-0"><span class="cstack"></span><span class="amt"></span></div>
    <div id="mid">
      <div id="potrow"><span id="potchips"></span><div id="pot"></div></div>
      <div id="board"></div>
      <div id="verdict"></div>
    </div>
    <div class="fcards" id="cards-0"></div>
    <div class="seat" id="seat-0">
      <div class="who"><span class="av">👤</span><span class="idc"><span class="nm"></span><span class="pos"></span></span><span class="stkc"><span class="stk"></span><span class="bbline"></span></span></div>
      <div class="said"></div>
      <div class="tbar"><i></i></div>
    </div>
    <div id="fx"></div>
  </div>
</div>


<div id="bottom">
  <div id="caption"></div>
  <div id="actions"></div>
</div>

<button id="peekback">SHOW RESULT</button>
<div id="matchover"><div class="card2">
  <h2 id="mo-title"></h2>
  <p id="mo-sub"></p>
  <button id="mo-again">NEW MATCH</button>
  <div class="sub2"><a id="mo-log">copy the session log</a></div>
</div></div>

<script type="module">
import { newHand, legal, act, evaluate, bestFive, handName, rankOf, suitOf, RANKS, rngFromSeed } from 'https://librepoker.org/play/engine/poker.js';
import { ladderDecide, setEquityEdges } from 'https://librepoker.org/play/engine/ladder.js';
import { riverMix } from 'https://librepoker.org/play/engine/river-solver.js';

const $ = (s) => document.querySelector(s);
const q = new URLSearchParams(location.search);
const G = Math.max(20, Math.min(1000000, Math.floor(Number(q.get('gold')) || 100)));
// Blinds default 5/10 — ten big blinds deep at the default hundred, a quick
// dash to the felt. ?sb=N overrides (bb is always 2sb), clamped so at least
// two big blinds fit the stake.
const SB = Math.max(1, Math.min(Math.floor(G / 4), Math.floor(Number(q.get('sb')) || 5)));
const BB = 2 * SB;

// ---- sealed mode (#180): arrive with ?did=&seal=&return= and the stake is
// REAL sealed gold — the same contract as the tavern's dice, same slip, same
// localStorage segment (same origin), so dice and poker share one purse.
const SEAL = (() => {
  const did = (q.get('did') || '').trim().toLowerCase();
  if (!/^did:nostr:[0-9a-f]{64}$/.test(did)) return null;
  return {
    did,
    seal: Math.max(0, Math.floor(Number(q.get('seal')) || 0)),
    ret: q.get('return') || 'https://nostr.social/tideholm/',
  };
})();
const segKey = () => 'tavern-seal-' + SEAL.did.slice(-8);
function loadSeg() {
  try {
    const s = JSON.parse(localStorage.getItem(segKey()));
    if (s && Number.isFinite(s.base) && Array.isArray(s.txs)) return s;
  } catch { /* fresh */ }
  return { base: SEAL.seal, txs: [] };
}
function saveSeg(s) { localStorage.setItem(segKey(), JSON.stringify(s)); }
function purse() { const s = loadSeg(); return s.base + s.txs.reduce((a, t) => a + t.delta, 0); }
let _sealTools = null;
async function sealTools() {
  if (_sealTools) return _sealTools;
  const base = 'https://melvincarvalho.github.io/tidegate/';
  const [core, keys] = await Promise.all([import(base + 'tidegate.js'), import(base + 'keys.js')]);
  const signer = await keys.keySigner();
  if (signer.pubkey !== SEAL.did.slice('did:nostr:'.length)) throw new Error('the stored key does not match this identity');
  _sealTools = { core, signer };
  return _sealTools;
}
async function signSealTx(delta, bet) {
  const { core, signer } = await sealTools();
  const s = loadSeg();
  const prev = s.base + s.txs.reduce((a, t) => a + t.delta, 0);
  const t = { did: SEAL.did, prev, delta, next: prev + delta };
  t.sig = await signer.sign(core.transitionBytes(t));
  t.pubkey = signer.pubkey;
  if (bet) t.bet = bet;   // evidence rides OUTSIDE the signature, by design
  s.txs.push(t);
  saveSeg(s);
  return t;
}
const b64url = (x) => btoa(unescape(encodeURIComponent(x))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
let matchId = null;
const GLYPH = { c: '♣', d: '♦', h: '♥', s: '♠' };
const ascii = (c) => RANKS[rankOf(c)] + 'cdhs'[suitOf(c)];
const isRed = (a) => a[1] === 'd' || a[1] === 'h';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const sha256hex = async (s) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map((x) => x.toString(16).padStart(2, '0')).join('');

// ---- sounds (the cash table's voice)
let ac = null, master = null, soundOn = localStorage.getItem('lp.sound') !== '0';
function audio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination); } catch { /* silent */ }
}
const ready = () => soundOn && ac && ac.state === 'running' && !document.hidden;
function blip(freq, dur = .06, gain = .05, type = 'triangle') {
  if (!ready()) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, ac.currentTime);
    g.gain.linearRampToValueAtTime(gain * 2.2, ac.currentTime + .003);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + dur);
  } catch { /* shrug */ }
}
const sq = (n, gap, dur, gain) => n.forEach((f, i) => setTimeout(() => blip(f, dur, gain, 'sine'), i * gap));
const sCard = () => blip(1180, .04, .02);
const sChip = () => blip(720, .05, .03);
const sPos = (btn) => btn ? sq([1320, 1760], 55, .05, .032) : blip(196, .12, .045, 'sine');
const sWin = () => sq([523, 659, 784, 1047], 90, .14, .05);
const sLose = () => sq([330, 262, 196], 120, .16, .045);
document.addEventListener('pointerdown', audio);
document.addEventListener('keydown', audio);
const sndBtn = $('#b-sound');
const drawSnd = () => { sndBtn.textContent = soundOn ? '🔊' : '🔇'; };
sndBtn.addEventListener('click', () => { soundOn = !soundOn; localStorage.setItem('lp.sound', soundOn ? '1' : '0'); drawSnd(); audio(); });
drawSnd();
let fourColor = localStorage.getItem('lp.fourc') !== '0';
const drawFourc = () => { document.body.classList.toggle('fourc', fourColor); $('#b-fourc').classList.toggle('on', fourColor); };
$('#b-fourc').addEventListener('click', () => { fourColor = !fourColor; localStorage.setItem('lp.fourc', fourColor ? '1' : '0'); drawFourc(); audio(); });
drawFourc();

// ---- cards & chips
function cardEl(a) {
  const d = document.createElement('div');
  d.className = 'card flipin s-' + a[1] + (isRed(a) ? ' red' : '');
  d.innerHTML = `<div class="cr">${a[0] === 'T' ? '10' : a[0]}<b>${GLYPH[a[1]]}</b></div><div class="cp">${GLYPH[a[1]]}</div>`;
  return d;
}
function backEl() { const d = document.createElement('div'); d.className = 'card back'; return d; }
const DENOMS = [[100 * SB, 'd500'], [20 * SB, 'd100'], [5 * SB, 'd25'], [SB, 'd5']];
function chipStackInto(el, amount) {
  el.innerHTML = '';
  let rest = Math.max(0, Math.round(amount / SB) * SB);
  for (const [v, cls] of DENOMS) {
    let n = Math.floor(rest / v); rest -= n * v;
    while (n > 0) {
      const col = document.createElement('span'); col.className = 'col ' + cls;
      for (let k = 0; k < Math.min(4, n); k++) col.appendChild(document.createElement('i'));
      el.appendChild(col); n -= Math.min(4, n);
    }
  }
}
const caption = (t) => { $('#caption').innerHTML = t; };

// ---- the brain, live from Libre Poker
caption('fetching the champion…');
const T = await fetch('https://librepoker.org/play/strategy-hulimit.json?v=18').then((r) => r.json());
if (T.edges) setEquityEdges(T.edges);
caption('');

// ---- the match: G gold a side, stacks carry, play to the felt
const seats = [0, 1].map((i) => ({
  root: $('#seat-' + i), nm: $(`#seat-${i} .nm`), pos: $(`#seat-${i} .pos`),
  stk: $(`#seat-${i} .stk`), bb: $(`#seat-${i} .bbline`), said: $(`#seat-${i} .said`),
  cards: $('#cards-' + i),
}));
const HERO = 0, BOT = 1;
let stacks = [G, G];
let h = null, handNo = 0, shownBoard = 0, commit8 = '';
const log = { game: 'den-hulimit', gold: G, sb: SB, bb: BB, started: Date.now(), hands: [] };

const drawScore = () => {
  const sealNote = SEAL ? ` · purse <b style="color:#7fd4e6">${purse().toLocaleString()}</b>` : '';
  $('#score').innerHTML = `you <b style="color:var(--gold)">${stacks[HERO].toLocaleString()}</b> · house <b style="color:var(--gold)">${stacks[BOT].toLocaleString()}</b> gold${sealNote}`;
};
if (SEAL) {
  const b = $('#denbadge');
  b.textContent = '⚑ SEALED · real gold';
  b.title = 'Playing for the sealed gold of ' + SEAL.did.slice(0, 20) + '… — stakes and winnings are signed trail moves.';
}

function dealCards() {
  seats[HERO].cards.innerHTML = '';
  for (const c of h.seats[HERO].hole) seats[HERO].cards.appendChild(cardEl(ascii(c)));
  seats[BOT].cards.innerHTML = '';
  for (const c of h.seats[BOT].hole) seats[BOT].cards.appendChild(backEl());
  sCard();
}
function revealBot() {
  seats[BOT].cards.innerHTML = '';
  for (const c of h.seats[BOT].hole) seats[BOT].cards.appendChild(cardEl(ascii(c)));
}
function syncBoard() {
  const b = $('#board');
  while (b.children.length < h.board.length && b.children.length < shownBoard) { b.appendChild(cardEl(ascii(h.board[b.children.length]))); sCard(); }
}
function render() {
  syncBoard();
  for (const i of [0, 1]) {
    const d = seats[i];
    d.nm.textContent = i === HERO ? 'You' : 'The house';
    d.stk.textContent = h.seats[i].stack.toLocaleString();
    d.bb.textContent = (h.seats[i].stack / BB).toFixed(0) + ' BB';
    d.pos.textContent = h.button === i ? 'SB' : 'BB';
    d.root.classList.toggle('glow', h.phase === 'act' && h.toAct === i);
    const bet = $('#bet-' + i);
    const amt = h.seats[i].streetCommit;
    bet.classList.toggle('show', amt > 0 && h.phase === 'act');
    if (amt > 0) { chipStackInto(bet.querySelector('.cstack'), amt); bet.querySelector('.amt').textContent = amt; }
  }
  const carried = h.seats[0].handCommit + h.seats[1].handCommit - h.seats[0].streetCommit - h.seats[1].streetCommit;
  $('#pot').textContent = carried > 0 ? 'Pot ' + carried.toLocaleString() : '';
  $('#table').classList.toggle('boardout', shownBoard > 0);
  document.querySelectorAll('.dbtn').forEach((e) => e.remove());
  const db = document.createElement('span'); db.className = 'dbtn'; db.textContent = 'D';
  seats[h.button].root.querySelector('.who').appendChild(db);
}

let keyTargets = null;
function heroTurn(L) {
  return new Promise((resolve) => {
    const bar = $('#actions');
    bar.innerHTML = '';
    bar.classList.toggle('pos-btn', h.button === HERO);
    bar.classList.toggle('pos-bb', h.button !== HERO);
    sPos(h.button === HERO);
    const mk = (id, label, a) => {
      const b = document.createElement('button');
      b.id = id; b.textContent = label;
      b.addEventListener('click', () => { bar.innerHTML = ''; keyTargets = null; sChip(); resolve(a); });
      bar.appendChild(b);
      return b;
    };
    mk('b-fold', 'FOLD', { seat: HERO, action: 'fold' });
    mk('b-call', L.callAmount === 0 ? 'CHECK' : 'CALL ' + L.callAmount, { seat: HERO, action: L.callAmount === 0 ? 'check' : 'call' });
    if (L.actions.includes('bet') || L.actions.includes('raise')) {
      mk('b-raise', (L.actions.includes('bet') ? 'BET ' : 'RAISE TO ') + L.minRaiseTo, { seat: HERO, action: L.actions.includes('bet') ? 'bet' : 'raise', amount: L.minRaiseTo });
    }
    keyTargets = ['b-fold', 'b-call', 'b-raise'];
  });
}
document.addEventListener('keydown', (e) => {
  if (!keyTargets) { if ((e.key === '1' || e.key === 'Enter') && $('#b-next')) $('#b-next').click(); return; }
  const idx = { 1: 0, f: 0, 2: 1, c: 1, 3: 2, r: 2 }[e.key];
  if (idx != null) document.getElementById(keyTargets[idx])?.click();
});

async function matchOver() {
  const won = stacks[HERO] > 0;
  $('#mo-title').textContent = won ? '🏆 You take the pot' : '💀 Felted';
  $('#mo-sub').textContent = won
    ? `The house is felled — ${(stacks[HERO]).toLocaleString()} gold is yours, over ${handNo} hands.`
    : `The house takes your ${G.toLocaleString()} gold over ${handNo} hands. The den never closes.`;
  // Let the final hand breathe before the curtain: the showdown, the golden
  // five, and whatever beat you deserve to be SEEN (learned from the felted
  // captain who never saw the hand).
  await sleep(2600);
  won ? sWin() : sLose();
  if (SEAL && won && matchId) {
    $('#mo-sub').textContent += ' Signing your winnings…';
    try {
      await signSealTx(2 * G, { venue: 'den', mark: matchId, stake: G });
      $('#mo-sub').textContent = $('#mo-sub').textContent.replace(' Signing your winnings…', ' Winnings signed to your slip.');
    } catch {
      $('#mo-sub').textContent += ' ⚠ signing failed — reopen the den with the same seal to retry.';
    }
  }
  if (SEAL) {
    const s = loadSeg();
    const home = document.createElement('div');
    home.className = 'sub2';
    home.innerHTML = `<a href="${SEAL.ret}?tavern=${b64url(JSON.stringify(s.txs))}">Settle up at Tideholm ↗</a>`
      + (s.txs.length >= 16 ? ` <b>— your slip carries ${s.txs.length} moves; the courier takes about 24, so settle soon.</b>` : '');
    $('#mo-again').after(home);
    $('#mo-again').textContent = purse() >= G ? 'NEW MATCH (same seal)' : 'PURSE TOO THIN';
    if (purse() < G) $('#mo-again').disabled = true;
  }
  $('#matchover').classList.add('show');
}
$('#mo-again').addEventListener('click', () => location.reload());
// Click the felt behind the modal to peek at the final hand; the chip brings
// the result back.
$('#matchover').addEventListener('click', (e) => {
  if (e.target === $('#matchover')) { $('#matchover').classList.add('peek'); $('#peekback').classList.add('show'); }
});
$('#peekback').addEventListener('click', () => { $('#matchover').classList.remove('peek'); $('#peekback').classList.remove('show'); });
$('#mo-log').addEventListener('click', async () => {
  log.finished = Date.now(); log.final = { you: stacks[HERO], house: stacks[BOT] };
  try { await navigator.clipboard.writeText(JSON.stringify(log)); $('#mo-log').textContent = 'copied ✓'; } catch { /* http */ }
});

async function playHand() {
  handNo++;
  const seed = await sha256hex(`den|${Date.now()}|${handNo}|${Math.random()}`);
  commit8 = (await sha256hex(seed)).slice(0, 8);
  h = newHand({ seats: [{ name: 'You', stack: stacks[HERO] }, { name: 'House', stack: stacks[BOT] }], button: handNo % 2, sb: SB, bb: BB, seedHex: seed, limit: true });
  const cache = {};
  shownBoard = 0;
  $('#verdict').textContent = '';
  $('#board').innerHTML = '';
  $('#tmeta').textContent = `limit hold'em · ${SB}/${BB} gold · hand #${handNo} · ${commit8}`;
  dealCards();
  render();
  drawScore();
  let lastStreet = 0, guard = 0;
  while (h.phase === 'act' && guard++ < 200) {
    if (h.street !== lastStreet) { lastStreet = h.street; shownBoard = [0, 3, 4, 5][h.street]; render(); await sleep(200); }
    const L = legal(h);
    if (L.seat === HERO) {
      render();
      const a = await heroTurn(L);
      act(h, a);
      seats[HERO].said.textContent = a.action + (a.amount ? ' ' + a.amount : '');
    } else {
      await sleep(250 + Math.random() * 350);
      let a = null;
      if (h.street === 3) {
        const mix = riverMix(h, BOT, T.table, cache);
        if (mix) {
          let x = Math.random(), pick = 0;
          for (let k = 0; k < mix.probs.length; k++) { x -= mix.probs[k]; if (x <= 0) { pick = k; break; } }
          const ch = mix.acts[Math.min(pick, mix.acts.length - 1)];
          if (ch === 'f' && L.callAmount > 0) a = { seat: BOT, action: 'fold' };
          else if (ch === 'b' && (L.actions.includes('bet') || L.actions.includes('raise'))) a = { seat: BOT, action: L.actions.includes('bet') ? 'bet' : 'raise', amount: L.minRaiseTo };
          else a = { seat: BOT, action: L.callAmount > 0 ? 'call' : 'check' };
        }
      }
      if (!a) a = ladderDecide(h, BOT, L, T.table, 0, Math.random);
      act(h, a);
      seats[BOT].said.textContent = a.action + (a.amount ? ' ' + a.amount : '');
    }
    render();
  }
  const r = h.result;
  shownBoard = h.board.length >= 3 ? h.board.length : shownBoard;
  if (r.showdown) revealBot();
  render();
  const winSeats = new Set(r.winners.map((x) => x.seat));
  if (r.showdown) {
    const winCards = new Set();
    for (const w of winSeats) for (const c of bestFive([...h.seats[w].hole, ...h.board])) winCards.add(c);
    [...$('#board').children].forEach((el, bi) => el.classList.add(winCards.has(h.board[bi]) ? 'win' : 'dead'));
    const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
    $('#verdict').innerHTML = Object.entries(r.evals ?? {}).map(([i, e]) =>
      `<span class="vtag ${winSeats.has(+i) ? 'vw' : 'vl'}">${+i === HERO ? 'You' : 'House'}: ${cap(handName(e))}</span>`).join('');
  }
  const before = [...stacks];
  stacks = [h.seats[HERO].stack, h.seats[BOT].stack];
  const delta = stacks[HERO] - before[HERO];
  log.hands.push({ n: handNo, commit: commit8, delta, you: stacks[HERO], house: stacks[BOT] });
  drawScore();
  $('#pot').classList.add('winline');
  $('#pot').textContent = delta > 0 ? `You win ${delta} gold` : delta < 0 ? `The house takes ${-delta}` : 'Split';
  seats.forEach((s2) => { s2.said.textContent = ''; });
  if (stacks[HERO] <= 0 || stacks[BOT] <= 0) { matchOver(); return false; }
  await new Promise((resolve) => {
    const bar = $('#actions');
    const bn = document.createElement('button');
    bn.id = 'b-next'; bn.textContent = 'NEXT HAND';
    bn.addEventListener('click', resolve);
    bar.appendChild(bn);
    setTimeout(resolve, 4000);
  });
  $('#actions').innerHTML = '';
  $('#pot').classList.remove('winline');
  return true;
}
drawScore();
(async () => {
  if (SEAL) {
    // Slip trimming: the seal carried in from the tidegate is what the
    // server holds, and pegged only reaches that number by applying this
    // slip in order. So walk the stored slip's running balance and cut at
    // the FIRST point it equals the seal: everything before is applied (or
    // can never chain again) and is archived; everything after is carried
    // on — if some of it turns out to be applied too, the server skips
    // those signatures, so nothing is lost and nothing double-credits.
    // Why it matters: the slip travels home in a URL, and the front proxy
    // refuses requests past ~16 KB of headers — a 28-move night was
    // "Bad Request" before the game ever saw it. Only a seal in the URL
    // counts; a reload after a match drops it (see the stake below).
    if (q.has('seal')) {
      const s0 = loadSeg();
      let bal = s0.base, k = -1;
      if (bal === SEAL.seal) k = 0;
      for (let i = 0; i < s0.txs.length && k < 0; i++) { bal += s0.txs[i].delta; if (bal === SEAL.seal) k = i + 1; }
      if (k > 0) {
        localStorage.setItem(segKey() + '-settled-' + Date.now(), JSON.stringify({ base: s0.base, txs: s0.txs.slice(0, k) }));
        saveSeg({ base: SEAL.seal, txs: s0.txs.slice(k) });
      }
    }
    // Slip hygiene: the browser may hold a SPENT slip from a settled visit —
    // the stored purse then disagrees with the fresh seal. Only the player
    // knows whether the old moves were redeemed, so a fresh slip is offered,
    // never assumed (an unsettled move on a discarded slip is gold lost).
    if (purse() < G && SEAL.seal >= G) {
      const oldTxs = loadSeg().txs;
      caption(`Your browser holds an old slip (purse ${purse().toLocaleString()}) but your seal says `
        + `<b>${SEAL.seal.toLocaleString()}</b>. `
        + (oldTxs.length ? `<a href="${SEAL.ret}?tavern=${b64url(JSON.stringify(oldTxs))}">Settle this slip at Tideholm first ↗</a> — or, ` : '')
        + `if it is already settled, `
        + `<a href="#" id="freshslip">start a fresh slip at ${SEAL.seal.toLocaleString()} gold</a>`);
      await new Promise((resolve) => {
        document.getElementById('freshslip').addEventListener('click', (ev) => {
          ev.preventDefault();
          const olds = loadSeg();
          if (olds.txs.length) localStorage.setItem(segKey() + '-settled-' + Date.now(), JSON.stringify(olds));
          saveSeg({ base: SEAL.seal, txs: [] });
          resolve();
        });
      });
      caption('');
      drawScore();
    }
    if (purse() < G) {
      caption(`⚠ your purse holds ${purse().toLocaleString()} gold — not enough for a ${G.toLocaleString()}-gold match. <a href="${SEAL.ret}">Return to Tideholm</a> for more.`);
      return;
    }
    // The slip rides home in a URL: ~390 bytes a move, and the front proxy
    // refuses requests past ~16 KB of headers (cookies included). 24 moves
    // (12 matches, ~9.5 KB) leaves room; past 22 the only play is to settle.
    const carried = loadSeg().txs.length;
    if (carried >= 22) {
      caption(`⚠ your slip already carries ${carried} moves — the courier home takes about 24 at most. `
        + `<a href="${SEAL.ret}?tavern=${b64url(JSON.stringify(loadSeg().txs))}">Settle up at Tideholm first ↗</a>, then come back with a fresh seal.`);
      return;
    }
    caption('signing your stake into the match…');
    try {
      matchId = [...crypto.getRandomValues(new Uint8Array(8))].map((x) => x.toString(16).padStart(2, '0')).join('');
      await signSealTx(-G, { venue: 'den', mark: matchId, stake: G });
      // The seal in the URL is now stale: drop it so NEW MATCH (a reload)
      // cannot re-run the arrival trimming against an unsettled purse.
      if (q.has('seal')) { q.delete('seal'); history.replaceState(null, '', location.pathname + '?' + q.toString()); }
    } catch (e) {
      caption('⚠ could not sign the stake — ' + (e.message || 'signing declined') + '. Nothing has moved.');
      return;
    }
    caption('');
    drawScore();
  }
  while (await playHand()) { /* to the felt */ }
})();
</script>
